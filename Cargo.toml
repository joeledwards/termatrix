[package]
name = "termatrix"
description = "The Matrix scrolling in your terminal"
version = "3.3.1"
authors = ["Joel Edwards <joeledwards@gmail.com>"]
edition = "2021"
keywords = ["cli", "falling", "matrix", "scrolling", "terminal"]
categories = ["command-line-utilities"]
repository = "https://github.com/joeledwards/termatrix/"
readme = "README.md"
license = "ISC"
include = ["src/**", "docs/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "README.md", "LICENSE", "CHANGELOG.md"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
ratatui = "0.29"
rand = "0.8.5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"
unicode-width = "0.2"
tempfile = "3"
term-colors = "0.2.0"
